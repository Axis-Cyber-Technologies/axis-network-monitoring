[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers/opnsense.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2021

# Inputs
[INPUT]
    Name              tcp
    Listen            0.0.0.0
    Port              5170
    Mode              tcp
    Format            none
    Tag               opnsense.syslog
    Chunk_Size        32k
    Buffer_Size       64k

[INPUT]
    Name              tail
    Path              /var/log/suricata/eve.json
    Parser            suricata_json
    Tag               suricata.eve
    Refresh_Interval  5
    Rotate_Wait       30
    DB                /var/lib/fluent-bit/eve.db

[INPUT]
    Name              tail
    Path              /var/log/ntopng/flows.json
    Parser            ntopng_json
    Tag               ntopng.flow
    Refresh_Interval  5
    Rotate_Wait       30
    DB                /var/lib/fluent-bit/ntopng.db

# Enrichment: GeoIP & static metadata
[FILTER]
    Name              modify
    Match             *
    Add               collector    opnsense-fw1
    Add               source_type  opnsense

[FILTER]
    Name              lua
    Match             *
    script            parsers/enrich.lua
    call              enrich_record

[FILTER]
    Name              geoip2
    Match             *
    Database          /usr/local/share/GeoIP/GeoLite2-City.mmdb
    Record            src_geo["country"]=country_code
    Record            src_geo["city"]=city_name
    Record            dst_geo["country"]=destination_country_code
    Record            dst_geo["city"]=destination_city_name
    Source            src_ip
    Destination       dst_ip

[FILTER]
    Name              rewrite_tag
    Match             suricata.eve
    Rule              $log exists suricata.alert true suricata.alert
    Rule              $log exists suricata.dns   true suricata.dns
    Emitter_Name      re_tagged

# Output to ClickHouse
[OUTPUT]
    Name              http
    Match             *
    Host              clickhouse
    Port              8123
    URI               /?
    Format            json
    json_date_key     ts
    json_date_format  iso8601
    json_date_precision 6
    Header            Authorization Basic ${CLICKHOUSE_BASIC_AUTH}
    Retry_Limit       False
    net.keepalive     On
    net.keepalive_idle_timeout 30

# Optional fan-out to Kafka
[OUTPUT]
    Name              kafka
    Match             opnsense.*
    Brokers           kafka-1.axis.local:9092,kafka-2.axis.local:9092,kafka-3.axis.local:9092
    Topics            opnsense-syslog
    Timestamp_Key     ts
